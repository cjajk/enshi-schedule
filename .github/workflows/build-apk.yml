name: Build APK

# 云端自动构建 APK（无需本地 Android SDK）
# 把本 android-app 目录作为 GitHub 仓库根推送后，此工作流自动编译并产出可下载 APK。
on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [main, master]  # 推送到 main/master 自动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Accept Android SDK licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Ensure Android SDK Platform 34
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=${ANDROID_HOME}"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon
        env:
          # 每次构建自动递增版本号：versionCode 用运行序号，versionName 同步
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: enshi-schedule-apk
          path: app/build/outputs/apk/debug/*.apk
